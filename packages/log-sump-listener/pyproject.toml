[project]
name = "log-sump-listener"
version = "0.1.0"
description = "Async Docker-daemon log and metric ingestion orchestrator for log-sump"
requires-python = ">=3.12"
dependencies = [
    "log-sump-common",
    "structlog>=24.4",
    "python-logstash-async>=2.7",
]

[tool.uv.sources]
log-sump-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/log_sump_listener"]
