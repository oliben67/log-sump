[project]
name = "log-sump-server"
version = "0.1.0"
description = "Async query API and daemon catalog server for log-sump"
requires-python = ">=3.12"
dependencies = [
    "log-sump-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.2",
    "pydantic>=2.9",
    "structlog>=24.4",
]

[tool.uv.sources]
log-sump-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/log_sump_server"]
