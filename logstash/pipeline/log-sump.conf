# Transport + parse layer between log-listener and Redis (spec §5.3).
#
# log-listener ships each Record as a JSON string via python-logstash-async,
# which wraps it in its own envelope ({@timestamp, host, level, message,
# ...} -- see logstash_async.formatter.LogstashFormatter) and sends it as a
# newline-delimited JSON line over TCP. The Record JSON itself lives
# verbatim in that envelope's `message` field; this pipeline's job is to
# validate it and forward *exactly that string*, unmodified, into Redis --
# not the envelope, and not a reserialized copy (which could silently
# reorder/normalize fields or numbers differently than the source). The
# ingestion consumer (log-server, log_sump_server.ingest.consumer) is what
# actually parses it into the shared Record schema and routes it into
# per-daemon/per-kind Streams -- see that module's docstring for why
# Logstash itself only validates rather than doing real schema enforcement.

input {
  tcp {
    port => 5959
    codec => json_lines
  }
}

filter {
  # Parse into a side field under @metadata (never included in the output
  # event) purely to validate shape and tag failures -- the forwarded
  # payload is still the raw `message` string below, untouched by this.
  json {
    source => "message"
    target => "[@metadata][record]"
    tag_on_failure => ["_recordjsonparsefailure"]
  }

  if "_recordjsonparsefailure" not in [tags] {
    if ![@metadata][record][kind] or ![@metadata][record][docker_host] {
      mutate {
        add_tag => ["_recordschemainvalid"]
      }
    }
  }
}

output {
  if "_recordjsonparsefailure" in [tags] or "_recordschemainvalid" in [tags] {
    # Dropped rather than forwarded -- log-server's consumer would reject
    # these anyway (spec §5.3: "enforce the record schema... and drop/flag
    # malformed entries"), so rejecting at the edge avoids shipping garbage
    # into the ingest list at all. Swap this branch for a `file` output
    # pointed at a dead-letter path if these need to be inspected later.
  } else {
    redis {
      host => ["${LOG_SUMP_REDIS_HOST:127.0.0.1}"]
      port => "${LOG_SUMP_REDIS_PORT:6379}"
      data_type => "list"
      # Must match log_sump_common.redis_keys.INGEST_LIST exactly -- there's
      # no way to share that Python constant into this config file, so if
      # one changes, the other has to change with it.
      key => "logsump:ingest:v1"
      codec => plain {
        format => "%{message}"
      }
    }
  }
}
