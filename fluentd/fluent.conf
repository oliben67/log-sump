# Transport + parse layer between log-listener and Redis (spec §5.3).
# Replaces logstash/pipeline/log-sump.conf 1:1 -- see plugin/
# out_log_sump_redis_list.rb's own docstring for why a custom output
# plugin, and README.md's migration note for the parity verification.
#
# log-listener ships each Record as a JSON string via python-logstash-async
# (AsynchronousLogstashHandler, default TcpTransport, ssl disabled), which
# wraps it in its own envelope ({@timestamp, host, level, message, ...} --
# see logstash_async.formatter.LogstashFormatter) and sends it as a
# newline-delimited JSON line over plain TCP -- confirmed directly from
# logstash_async's own transport.py/handler.py, not inferred. The Record
# JSON itself lives verbatim in that envelope's `message` field; this
# pipeline's job is to validate it and forward *exactly that string*,
# unmodified, into Redis -- not the envelope, and not a reserialized copy.
# The ingestion consumer (log-server, log_sump_server.ingest.consumer) is
# what actually parses it into the shared Record schema and routes it into
# per-daemon/per-kind Streams.

<system>
  # Matches the single Logstash pipeline.workers: 1 this replaces -- logs
  # and metrics both arrive at low, bursty volume, and a single worker
  # keeps ordering closer to arrival order (see out_log_sump_redis_list.rb's
  # <buffer> flush_thread_count for the other half of that guarantee).
  workers 1
</system>

<source>
  @type tcp
  tag logsump.raw
  # Same listen address/port Logstash's tcp input used (its `host` option
  # defaults to 0.0.0.0, never overridden in the config it replaces) --
  # never externally reachable regardless, since ../docker-compose*.yml
  # never publishes 5959.
  bind 0.0.0.0
  port 5959
  <parse>
    # AsynchronousLogstashHandler's envelope IS the wire-level JSON object
    # (`{"@timestamp": ..., "message": "<raw record JSON>", ...}`) -- this
    # parses *that* envelope (matching Logstash's own json_lines codec,
    # which does the same), giving a `message` field whose *value* is the
    # original record string, untouched. That's a plain JSON string-value
    # extraction, not a re-serialization of the record itself -- parsing a
    # JSON string value and reading it back out is lossless, unlike
    # re-serializing the record as a *nested object* would be (key order,
    # number formatting could differ) -- which is exactly why the output
    # plugin forwards this extracted string as-is rather than
    # `record.to_json`-ing anything.
    @type json
  </parse>
</source>

<match logsump.raw>
  @type log_sump_redis_list
  host "#{ENV['LOG_SUMP_REDIS_HOST'] || '127.0.0.1'}"
  port "#{ENV['LOG_SUMP_REDIS_PORT'] || '6379'}"
  # Must match log_sump_common.redis_keys.INGEST_LIST exactly -- there's no
  # way to share that Python constant into this config file, so if one
  # changes, the other has to change with it (same constraint the Logstash
  # config it replaces had).
  key logsump:ingest:v1
</match>
