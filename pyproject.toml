[project]
name = "log-sump"
version = "0.4.1"
description = "Async Docker-daemon log/metric collection, query API, and daemon catalog server"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "redis>=5.2",
    "structlog>=24.4",
    "python-logstash-async>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",  # required by FastAPI's UploadFile (POST /files/upload)
    "croniter>=6.0",  # scheduling.py (Phase 4) -- same cron library a prior gateway impl used
    "paramiko>=3.5",  # common/transport.py's SSHTransport -- a pure-Python ssh client, no ssh binary needed
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "fakeredis>=2.26",
    "ruff>=0.7",
    "ty>=0.0.71",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/log_sump"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# tests/{common,listener,server}/ share test-file basenames across
# directories (e.g. both listener/ and server/ have their own test_app.py),
# and each is a package via its own __init__.py so relative imports like
# `from .conftest import ...` work within it. The default "prepend" import
# mode requires globally-unique top-level module names and collides on
# those repeated basenames; importlib mode identifies modules by full path
# instead, which is what actually resolves it.
addopts = ["--import-mode=importlib", "-m", "not integration"]
markers = [
    "integration: exercises a real Redis via docker-compose.dev.yml (`task dev:up` first); excluded from the default `task test` run",
]

[tool.ty.environment]
python-version = "3.12"
